name: CI

# Deploys are done by Workers Builds (Cloudflare's Git integration):
# `main` runs `npm run deploy`, other branches `npm run preview`.
# This workflow only checks the code.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lockfile yet (see README); switch to `npm ci` once one is committed.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

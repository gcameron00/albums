name = "albums"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Only albums.gcameron.com is used. The workers.dev URL is not covered by
# the Access application, so it is off.
workers_dev = false
# Preview URLs are what Workers Builds gives non-production branches.
preview_urls = true

routes = [
  { pattern = "albums.gcameron.com", custom_domain = true }
]

# Static files (CSS, favicon). Every request reaches the Worker first; it
# hands /assets/* and anything it does not route to ASSETS.
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

# Access application "Albums admin" protects albums.gcameron.com/admin and
# /mcp (one-time PIN for me, Service Auth for the Shortcut, Managed OAuth for
# MCP clients). Neither value is secret. The Worker refuses every /admin and
# /mcp request if either is empty. ACCESS_AUD may list several audience tags,
# comma-separated, if /mcp ever needs an Access application of its own.
[vars]
STOREFRONT = "ch"
ACCESS_TEAM_DOMAIN = "grahamcameron.cloudflareaccess.com"
ACCESS_AUD = "7294bf907a4cd878c6c00a12c2dc122b9405423afbd6a8b2b4ea8f5e6b4b216b"
# Apple Music API (MusicKit key). Team ID and Key ID are not secret. The key
# itself is the secret APPLE_MUSIC_KEY (wrangler secret put APPLE_MUSIC_KEY).
# While any of the three is empty, albums are read from their
# music.apple.com page instead (src/apple.ts).
APPLE_TEAM_ID = ""
APPLE_KEY_ID = ""

# Created 2026-11-08 (location hint: WEUR). Migrations are applied by
# `npm run deploy` before every production deploy.
[[d1_databases]]
binding = "DB"
database_name = "albums"
database_id = "b53e925c-42c1-4820-bd69-070075766207"
migrations_dir = "migrations"

# Worker Previews: branch builds run `npm run preview`, which applies D1
# migrations to the preview database and then runs `wrangler preview`.
# Previews never touch production data. The migrations target lives in
# wrangler.preview-migrations.toml and must name the same database.
[previews.vars]
STOREFRONT = "ch"
ACCESS_TEAM_DOMAIN = "grahamcameron.cloudflareaccess.com"
# Audience of the Access application that protects Preview URLs (Worker →
# Settings → Domains & Routes → Preview URLs → Enable Cloudflare Access).
ACCESS_AUD = "51696e9c66555c986386dff051146cb36ef051d5483181ec7bc971e878ef5253"
APPLE_TEAM_ID = ""
APPLE_KEY_ID = ""

[[previews.d1_databases]]
binding = "DB"
database_name = "albums-preview"
database_id = "934a0dc8-be92-4cbb-b591-dc8984508e91"
